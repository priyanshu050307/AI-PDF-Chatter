version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pdfchatter_postgres
    restart: always
    environment:
      POSTGRES_USER: pdfuser
      POSTGRES_PASSWORD: pdfpassword
      POSTGRES_DB: pdfchatter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pdfchatter_redis
    restart: always
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2023-09-04T19-57-37Z
    container_name: pdfchatter_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
